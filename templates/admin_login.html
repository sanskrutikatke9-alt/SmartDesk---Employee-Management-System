<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login | SmartDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <link rel="stylesheet"
        href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">

   <link rel="stylesheet" href="{{ url_for('static', filename = 'css/style.css')}}">
</head>

<body>

<div class="container d-flex justify-content-center align-items-center vh-100">

    <div class="login-form">

        <div class="text-center mb-4">

            <i class="bi bi-shield-lock-fill login-icon"></i>

            <h2 class="fw-bold mt-3">Admin Login</h2>

            <p class="text-muted">
                Sign in to access the SmartDesk Admin Panel
            </p>

        </div>

       {% with messages = get_flashed_messages(with_categories=true) %}
    {% if messages %}
        {% for category, message in messages %}
            <div class="alert alert-{{ category }} alert-dismissible fade show">
                {{ message }}
                <button type="button"
                        class="btn-close"
                        data-bs-dismiss="alert"></button>
            </div>
        {% endfor %}
    {% endif %}
{% endwith %}
        
        <form action="{{ url_for('admin_login') }}" method="POST">

            <div class="mb-3">

                <label class="form-label">Admin ID</label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-person-badge-fill"></i>
                    </span>

                    <input
                        type="text"
                        name="username"
                        class="form-control"
                        placeholder="Enter Admin ID"
                        required>

                </div>

            </div>

            <div class="mb-3">

                <label class="form-label">Password</label>

                <div class="input-group">

                    <span class="input-group-text">
                        <i class="bi bi-lock-fill"></i>
                    </span>

                    <input
                        type="password"
                        name="password"
                        class="form-control"
                        placeholder="Enter Password"
                        required>

                </div>

            </div>

            <div class="d-flex justify-content-between mb-4">

                <div class="form-check">

                    <input class="form-check-input" type="checkbox">

                    <label class="form-check-label">
                        Remember Me
                    </label>

                </div>

                <a href="#" class="text-decoration-none">
                    Forgot Password?
                </a>

            </div>

           <button type="submit" class="btn btn-primary w-100 py-2">
            Login
           </button>

        </form>

    </div>

</div>
   <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
   <!-- <script src = "{{ url_for('static', filename = 'js/style.js')}}"></script> -->
</body>
</html>
