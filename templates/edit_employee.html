<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Edit Employee | SmartDesk</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css"
          rel="stylesheet">

    <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css"
          rel="stylesheet">

</head>

<body class="bg-light">

<div class="container py-5">

    <div class="card shadow-lg">

        <div class="card-header bg-primary text-white">

            <h3 class="mb-0">

                <i class="bi bi-pencil-square"></i>

                Edit Employee

            </h3>

        </div>

        <div class="card-body">

            <form method="POST">

                <div class="row">

                    <!-- Employee ID -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Employee ID

                        </label>

                        <input
                            type="text"
                            name="employee_id"
                            class="form-control"
                            value="{{ employee.employee_id }}"
                            required>

                    </div>

                    <!-- Full Name -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Full Name

                        </label>

                        <input
                            type="text"
                            name="name"
                            class="form-control"
                            value="{{ employee.name }}"
                            required>

                    </div>

                    <!-- Email -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Email

                        </label>

                        <input
                            type="email"
                            name="email"
                            class="form-control"
                            value="{{ employee.email }}"
                            required>

                    </div>
<!-- Phone -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Phone

                        </label>

                        <input
                            type="text"
                            name="phone"
                            class="form-control"
                            value="{{ employee.phone }}"
                            required>

                    </div>

                    <!-- Department -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Department

                        </label>

                        <select
                            name="department"
                            class="form-select"
                            required>

                            <option value="HR"
                                {% if employee.department=="HR" %}selected{% endif %}>
                                HR
                            </option>

                            <option value="Frontend"
                                {% if employee.department=="Frontend" %}selected{% endif %}>
                                Frontend
                            </option>

                            <option value="Backend"
                                {% if employee.department=="Backend" %}selected{% endif %}>
                                Backend
                            </option>

                            <option value="UI/UX"
                                {% if employee.department=="UI/UX" %}selected{% endif %}>
                                UI/UX
                            </option>

                            <option value="Finance"
                                {% if employee.department=="Finance" %}selected{% endif %}>
                                Finance
                            </option>

                            <option value="Marketing"
                                {% if employee.department=="Marketing" %}selected{% endif %}>
                                Marketing
                            </option>

                        </select>

                    </div>

                    <!-- Designation -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Designation

                        </label>

                        <input
                            type="text"
                            name="designation"
                            class="form-control"
                            value="{{ employee.designation }}"
                            required>

                    </div>
<!-- Joining Date -->

                    <div class="col-md-6 mb-3">

                        <label class="form-label">

                            Joining Date

                        </label>

                        <input
                            type="date"
                            name="joining_date"
                            class="form-control"
                            value="{{ employee.joining_date.strftime('%Y-%m-%d') if employee.joining_date else '' }}"
                            required>

                    </div>

                </div>

                <div class="mt-4">

                    <button
                        type="submit"
                        class="btn btn-success">

                        <i class="bi bi-check-circle-fill"></i>

                        Update Employee

                    </button>

                    <a
                        href="{{ url_for('employees') }}"
                        class="btn btn-secondary">

                        Cancel

                    </a>

                </div>

            </form>

        </div>

    </div>

</div>
</body>
</html>

<!-- second ends -->
